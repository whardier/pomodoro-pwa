<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro Dial</title>
<meta name="description" content="Touch Pomodoro timer with presets, a jog dial and quick minute nudges.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16110f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: one-screen kiosk for a 960×480 landscape panel — jog dial on the left, timer tabs + chunky controls on the right; stacks in portrait. */
:root {
  --bg: #16110f;
  --surface: #241c19;
  --btn: #2e2420;
  --btn-press: #3d302b;
  --line: #4a3a33;
  --fg: #f5ebe4;
  --muted: #a8968b;
  --ink: #1b0f0b;
  /* timer colors, always assigned in this order: 1 red, 2 orange, 3 yellow, 4 green, 5 blue */
  --red: #ff4b4b;
  --orange: #ff8c32;
  --yellow: #ffd23f;
  --green: #5ccf6a;
  --blue: #4aa6ff;
  --accent: var(--red);
  --font-digits: "Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-ui: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --gap: clamp(6px, 1.6vh, 12px);
  --dial: min(calc(100vh - 28px), 47vw);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.app {
  height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: clamp(12px, 3vw, 32px);
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Dial ---------- */
.dial {
  position: relative;
  width: var(--dial);
  height: var(--dial);
  max-width: 100%;
}
.dial svg {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
.dial.scrubbing svg { cursor: grabbing; }
.bezel { fill: var(--surface); }
.bezel-edge { fill: none; stroke: var(--line); stroke-width: 1; }
.tick { stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; opacity: .55; }
.tick.major { stroke: var(--fg); stroke-width: 2; opacity: .8; }
.grip { fill: var(--accent); transition: fill .3s; }
.track { fill: none; stroke: var(--btn); stroke-width: 7; }
.arc {
  fill: none;
  stroke: var(--accent);
  stroke-width: 7;
  stroke-linecap: round;
  transition: stroke-dashoffset .25s linear, stroke .3s;
}
.dial.scrubbing .arc, .dial.switching .arc { transition: stroke .3s; }
.face { fill: var(--bg); }

.readout {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  gap: calc(var(--dial) * 0.015);
}
.mode-label {
  font-size: calc(var(--dial) * 0.058);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
  transition: color .3s;
}
.time {
  font-family: var(--font-digits);
  font-weight: 700;
  font-size: calc(var(--dial) * 0.2);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
.status {
  font-size: calc(var(--dial) * 0.052);
  font-weight: 500;
  color: var(--muted);
  min-height: 1.2em;
}
.dial.paused .time { animation: blink 1.4s steps(2, jump-none) infinite; }
.dial.done .time { color: var(--accent); }
@keyframes blink { 50% { opacity: .45; } }

/* ---------- Controls ---------- */
.controls {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  height: 100%;
  justify-content: center;
}

button {
  font: inherit;
  color: var(--fg);
  background: var(--btn);
  border: 1px solid var(--line);
  border-radius: 10px;
  min-height: 48px;
  cursor: pointer;
  touch-action: manipulation;
  transition: background .12s, transform .08s, border-color .2s;
}
button:active { background: var(--btn-press); transform: scale(.97); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Target end time */
.eta {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
}
.eta-label {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.eta-time {
  font-family: var(--font-digits);
  font-weight: 700;
  font-size: clamp(18px, 5vh, 24px);
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  transition: color .3s;
}
.eta-day { font-size: 15px; font-weight: 600; color: var(--muted); }

/* Timer tabs */
.top {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.tabs {
  display: flex;
  gap: 6px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 3px;
  margin: -3px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  --c: var(--red);
  flex: 0 0 auto;
  min-height: 46px;
  padding: 0 10px 0 8px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-digits);
  font-weight: 700;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  background: var(--surface);
}
.tab .dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid var(--c);
  box-sizing: border-box;
}
.tab.running .dot { background: var(--c); }
.tab.done { color: var(--c); animation: blink 1s steps(2, jump-none) infinite; }
.tab[aria-selected="true"] {
  color: var(--fg);
  background: var(--btn-press);
  border-color: var(--c);
  box-shadow: inset 0 0 0 1px var(--c);
}
.tab-x {
  flex: 0 0 auto;
  min-height: 46px;
  min-width: 40px;
  padding: 0;
  font-size: 22px;
  line-height: 1;
  color: var(--muted);
  background: transparent;
  border-color: transparent;
}
.icon-btn {
  flex: 0 0 auto;
  min-height: 46px;
  min-width: 46px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn[aria-pressed="false"] { color: var(--muted); }
.add-btn { font-size: 26px; font-weight: 500; line-height: 1; }

.presets {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--gap);
}
.preset {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px 2px;
  min-height: clamp(48px, 13vh, 64px);
  line-height: 1.05;
}
.preset b { font-family: var(--font-digits); font-size: clamp(18px, 5vh, 24px); font-weight: 700; }
.preset span { font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.preset[aria-pressed="true"] span { color: var(--accent); }

.nudges {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--gap);
}
.nudge {
  font-family: var(--font-digits);
  font-weight: 700;
  font-size: clamp(17px, 4.6vh, 22px);
  min-height: clamp(48px, 12vh, 58px);
}
.nudge small { font-family: var(--font-ui); font-weight: 600; font-size: .7em; color: var(--muted); margin-left: 2px; }
.nudge.minus { background: var(--surface); }

.actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr);
  gap: var(--gap);
}
.reset { font-size: 19px; font-weight: 600; min-height: clamp(54px, 15vh, 72px); }
.go {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--ink);
  font-size: clamp(20px, 5.6vh, 28px);
  font-weight: 700;
  letter-spacing: .04em;
  min-height: clamp(54px, 15vh, 72px);
  transition: background .3s, border-color .3s, transform .08s;
}
.go:active { background: var(--accent); filter: brightness(.88); }

/* Portrait / phone */
@media (max-aspect-ratio: 1/1) {
  body { overflow-y: auto; }
  .app {
    grid-template-columns: minmax(0, 1fr);
    justify-items: center;
    height: auto;
    min-height: 100%;
    align-content: center;
  }
  .dial { --dial: min(86vw, 52vh); }
  .controls { width: 100%; max-width: 520px; height: auto; }
}

@media (prefers-reduced-motion: reduce) {
  .arc { transition: none; }
  .dial.paused .time, .tab.done { animation: none; }
  button:active { transform: none; }
}
</style>

</head>
<body>
<main class="app">
  <div class="dial" id="dial">
    <svg viewBox="0 0 200 200" id="dialSvg" role="slider" aria-label="Jog dial: turn clockwise to add time, counter-clockwise to remove time" tabindex="0">
      <circle class="bezel" cx="100" cy="100" r="99"></circle>
      <circle class="bezel-edge" cx="100" cy="100" r="98.5"></circle>
      <g id="jog"></g>
      <circle class="face" cx="100" cy="100" r="82"></circle>
      <circle class="track" cx="100" cy="100" r="74"></circle>
      <circle class="arc" id="arc" cx="100" cy="100" r="74" transform="rotate(-90 100 100)"></circle>
    </svg>
    <div class="readout">
      <div class="mode-label" id="modeLabel">Focus</div>
      <div class="time" id="time">25:00</div>
      <div class="status" id="status">Ready</div>
    </div>
  </div>

  <section class="controls" aria-label="Timer controls">
    <div class="eta" id="eta" aria-live="off">
      <span class="eta-label" id="etaLabel">Ends at</span>
      <span class="eta-time" id="etaTime">--:--</span>
      <span class="eta-day" id="etaDay"></span>
    </div>
    <div class="top">
      <div class="tabs" id="tabs" role="tablist" aria-label="Timers"></div>
      <button class="icon-btn add-btn" id="addBtn" aria-label="Add timer">+</button>
      <button class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Sound">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
      </button>
      <button class="icon-btn" id="fsBtn" aria-label="Full screen" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
      </button>
    </div>

    <div class="presets" id="presets">
      <button class="preset" data-min="25" data-mode="focus" id="p25"><b>25</b><span>Focus</span></button>
      <button class="preset" data-min="50" data-mode="focus" id="p50"><b>50</b><span>Deep</span></button>
      <button class="preset" data-min="5" data-mode="break" id="p5"><b>5</b><span>Break</span></button>
      <button class="preset" data-min="15" data-mode="break" id="p15"><b>15</b><span>Long</span></button>
    </div>

    <div class="nudges">
      <button class="nudge minus" data-d="-60" id="m1">−1<small>min</small></button>
      <button class="nudge minus" data-d="-180" id="m3">−3<small>min</small></button>
      <button class="nudge minus" data-d="-300" id="m5">−5<small>min</small></button>
      <button class="nudge" data-d="60" id="a1">+1<small>min</small></button>
      <button class="nudge" data-d="180" id="a3">+3<small>min</small></button>
      <button class="nudge" data-d="300" id="a5">+5<small>min</small></button>
    </div>

    <div class="actions">
      <button class="reset" id="resetBtn">Reset</button>
      <button class="go" id="goBtn">Start</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var MAX = 99 * 60 + 59;
  var SEC_PER_TURN = 300;      // one full turn of the dial = 5 minutes
  var STEP = 5;                // dial moves in 5-second detents
  var MAX_TIMERS = 5;
  var COLORS = ["red", "orange", "yellow", "green", "blue"];
  var R = 74, CIRC = 2 * Math.PI * R;

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var dial = $("dial"), svg = $("dialSvg"), jog = $("jog"), arc = $("arc");
  var timeEl = $("time"), statusEl = $("status"), modeLabel = $("modeLabel");
  var goBtn = $("goBtn"), tabsEl = $("tabs");

  var G = { timers: [], sel: 0, sound: true, rot: 0, focusDone: 0 };

  function store(k, v) { try { localStorage.setItem("pd_" + k, JSON.stringify(v)); } catch (e) {} }
  function load(k, d) { try { var v = localStorage.getItem("pd_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save() { store("timers", { timers: G.timers, sel: G.sel, focusDone: G.focusDone }); }

  function newTimer(color, min, mode) {
    return { color: color, mode: mode || "focus", presetMin: min || 25, total: (min || 25) * 60,
             remaining: (min || 25) * 60, running: false, endAt: 0, done: false };
  }
  function cur() { return G.timers[G.sel]; }
  // Colors follow slot order, so timer 1 is always red, timer 2 orange, and so on.
  function recolor() { G.timers.forEach(function (t, i) { t.color = COLORS[i % COLORS.length]; }); }

  /* ---------- Build jog ticks ---------- */
  (function buildTicks() {
    var html = "";
    for (var i = 0; i < 60; i++) {
      var a = i * 6 * Math.PI / 180, major = i % 5 === 0;
      var r1 = major ? 85 : 87.5, r2 = 95;
      html += '<line class="tick' + (major ? " major" : "") + '" x1="' + (100 + r1 * Math.sin(a)).toFixed(2) +
        '" y1="' + (100 - r1 * Math.cos(a)).toFixed(2) + '" x2="' + (100 + r2 * Math.sin(a)).toFixed(2) +
        '" y2="' + (100 - r2 * Math.cos(a)).toFixed(2) + '"></line>';
    }
    html += '<circle class="grip" cx="100" cy="9.5" r="4.2"></circle>';
    jog.innerHTML = html;
    arc.setAttribute("stroke-dasharray", CIRC.toFixed(2));
  })();

  /* ---------- Audio ---------- */
  var ctx = null;
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, gain, type) {
    var c = audio(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function click() { if (G.sound) tone(1800, 0, 0.03, 0.06, "square"); }
  // Each color gets its own chime pitch so you can tell timers apart by ear.
  var CHIME_BASE = { red: 523, orange: 587, yellow: 659, green: 784, blue: 880 };  // rising with timer number
  function chime(color) {
    if (!G.sound) return;
    var b = CHIME_BASE[color] || 659, notes = [b, b * 1.189, b * 1.498];
    for (var rep = 0; rep < 3; rep++)
      for (var i = 0; i < 3; i++) tone(notes[i], rep * 1.1 + i * 0.18, 0.9, 0.25);
  }

  /* ---------- Wake lock ---------- */
  var lock = null;
  function anyRunning() { for (var i = 0; i < G.timers.length; i++) if (G.timers[i].running) return true; return false; }
  function wake() {
    if (!("wakeLock" in navigator) || lock) return;
    navigator.wakeLock.request("screen").then(function (l) {
      lock = l; l.addEventListener("release", function () { lock = null; });
    }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && anyRunning()) wake();
  });

  /* ---------- Timer core ---------- */
  function rem(t) { return t.running ? Math.max(0, (t.endAt - Date.now()) / 1000) : t.remaining; }

  function setRemaining(t, r) {
    r = Math.max(0, Math.min(MAX, r));
    if (t.running) t.endAt = Date.now() + r * 1000; else t.remaining = r;
    if (r > t.total) t.total = r;
    if (r > 0) t.done = false;
    if (r === 0 && t.running) finish(t);
    render(); save();
    return r;
  }
  function start(t) {
    audio();
    if (rem(t) <= 0) return;
    t.endAt = Date.now() + t.remaining * 1000;
    t.running = true; t.done = false;
    wake(); render(); save();
  }
  function pause(t) {
    if (!t.running) return;
    t.remaining = Math.ceil(rem(t));
    t.running = false; render(); save();
  }
  function finish(t) {
    t.endedAt = t.running ? Math.min(t.endAt, Date.now()) : Date.now();
    t.running = false; t.remaining = 0; t.done = true;
    if (t.mode === "focus") G.focusDone++;
    chime(t.color);
    if (!drag) G.sel = G.timers.indexOf(t);   // bring the finished timer to the dial
    render(); save();
  }
  function loadPreset(t, min, mode) {
    t.running = false; t.done = false;
    t.presetMin = min; t.mode = mode;
    t.total = t.remaining = min * 60;
    render(); save();
  }
  function nextUp(t) {
    if (t.mode === "focus") return G.focusDone > 0 && G.focusDone % 4 === 0 ? { min: 15, mode: "break" } : { min: 5, mode: "break" };
    return { min: 25, mode: "focus" };
  }

  /* ---------- Render ---------- */
  function fmt(s) {
    var m = Math.floor(s / 60), x = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (x < 10 ? "0" : "") + x;
  }
  function shown(t) { var r = rem(t); return t.running ? Math.ceil(r - 1e-6) : Math.round(r); }
  function labelFor(t) {
    return t.mode === "focus" ? (t.presetMin >= 50 ? "Deep focus" : "Focus") : (t.presetMin >= 15 ? "Long break" : "Break");
  }

  var tabSig = "";
  function renderTabs() {
    var sig = G.timers.map(function (t) { return t.color; }).join() + "|" + G.sel;
    if (sig !== tabSig) {
      tabSig = sig;
      var html = "";
      G.timers.forEach(function (t, i) {
        html += '<button class="tab" role="tab" data-i="' + i + '" style="--c: var(--' + t.color + ')" aria-label="' +
          t.color + ' timer"><i class="dot"></i><span></span></button>';
        if (i === G.sel && G.timers.length > 1)
          html += '<button class="tab-x" data-x="' + i + '" aria-label="Remove ' + t.color + ' timer">×</button>';
      });
      tabsEl.innerHTML = html;
      var selTab = tabsEl.querySelector('[data-i="' + G.sel + '"]');
      if (selTab && selTab.scrollIntoView) selTab.scrollIntoView({ block: "nearest", inline: "nearest" });
    }
    var tabs = tabsEl.querySelectorAll(".tab");
    for (var i = 0; i < tabs.length; i++) {
      var t = G.timers[i], txt = fmt(shown(t));
      var sp = tabs[i].lastChild;
      if (sp.textContent !== txt) sp.textContent = txt;
      tabs[i].setAttribute("aria-selected", i === G.sel ? "true" : "false");
      tabs[i].classList.toggle("running", t.running);
      tabs[i].classList.toggle("done", t.done && i !== G.sel);
    }
    $("addBtn").hidden = G.timers.length >= MAX_TIMERS;
  }

  // Local wall-clock time the selected timer will hit 00:00. While paused or not yet
  // started it is "now + time left", so it keeps sliding later every second.
  var etaLabel = $("etaLabel"), etaTime = $("etaTime"), etaDay = $("etaDay");
  function clock(ms) {
    try { return new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }); }
    catch (e) { var d = new Date(ms); return d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2); }
  }
  function dayTag(ms) {
    var d = new Date(ms), now = new Date();
    if (d.toDateString() === now.toDateString()) return "";
    var tmr = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    if (d.toDateString() === tmr.toDateString()) return "tomorrow";
    try { return d.toLocaleDateString([], { weekday: "short" }); } catch (e) { return ""; }
  }
  function renderEta(t, r, paused) {
    var label, at;
    if (t.done) { label = "Ended at"; at = t.endedAt || Date.now(); }
    else if (t.running) { label = "Ends at"; at = t.endAt; }
    else { label = paused ? "Resume now, ends" : "Start now, ends"; at = Date.now() + Math.round(r) * 1000; }
    var txt = clock(at), day = dayTag(at);
    if (etaLabel.textContent !== label) etaLabel.textContent = label;
    if (etaTime.textContent !== txt) etaTime.textContent = txt;
    if (etaDay.textContent !== day) etaDay.textContent = day;
  }

  var lastShown = "", lastColor = "";
  function render() {
    var t = cur(), r = rem(t), txt = fmt(shown(t));
    if (txt !== lastShown) { timeEl.textContent = txt; lastShown = txt; }
    document.title = anyRunning() ? txt + " · Pomodoro Dial" : "Pomodoro Dial";

    if (t.color !== lastColor) {
      dial.classList.add("switching");
      root.style.setProperty("--accent", "var(--" + t.color + ")");
      lastColor = t.color;
      setTimeout(function () { dial.classList.remove("switching"); }, 50);
    }
    var frac = t.total > 0 ? Math.min(1, r / t.total) : 0;
    arc.setAttribute("stroke-dashoffset", (CIRC * (1 - frac)).toFixed(2));
    jog.setAttribute("transform", "rotate(" + G.rot.toFixed(1) + " 100 100)");
    modeLabel.textContent = labelFor(t);

    var paused = !t.running && !t.done && r < t.total;
    dial.classList.toggle("paused", paused);
    dial.classList.toggle("done", t.done);

    if (t.done) {
      statusEl.textContent = "Time’s up";
      var n = nextUp(t);
      goBtn.textContent = n.mode === "break" ? "Start " + n.min + "-min break" : "Start focus";
    } else if (t.running) {
      statusEl.textContent = t.mode === "focus" ? "Focusing" : "On break";
      goBtn.textContent = "Pause";
    } else if (paused) {
      statusEl.textContent = "Paused · turn dial to adjust";
      goBtn.textContent = "Resume";
    } else {
      statusEl.textContent = "Ready";
      goBtn.textContent = "Start";
    }

    renderEta(t, r, paused);

    var btns = document.querySelectorAll(".preset");
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      b.setAttribute("aria-pressed", (+b.dataset.min === t.presetMin && b.dataset.mode === t.mode) ? "true" : "false");
    }
    renderTabs();

    $("soundBtn").setAttribute("aria-pressed", G.sound ? "true" : "false");
    $("waves").style.opacity = G.sound ? 1 : 0;
    svg.setAttribute("aria-valuetext", txt + " remaining");
  }

  setInterval(function () {
    for (var i = 0; i < G.timers.length; i++) {
      var t = G.timers[i];
      if (t.running && rem(t) <= 0) finish(t);
    }
    render();   // always: a paused timer's end time keeps moving out
  }, 250);

  /* ---------- Dial gesture ---------- */
  var drag = null;
  function angleOf(e) {
    var b = svg.getBoundingClientRect();
    return Math.atan2(e.clientY - (b.top + b.height / 2), e.clientX - (b.left + b.width / 2)) * 180 / Math.PI;
  }
  svg.addEventListener("pointerdown", function (e) {
    audio();
    var t = cur();
    if (t.running) pause(t);
    if (t.done) t.done = false;
    t.remaining = Math.round(t.remaining);
    drag = { id: e.pointerId, last: angleOf(e), acc: 0 };
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    dial.classList.add("scrubbing");
    e.preventDefault();
  });
  svg.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var t = cur();
    var a = angleOf(e), d = a - drag.last;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    drag.last = a;
    // clockwise (d > 0) adds time; counter-clockwise removes time
    var before = t.remaining;
    drag.acc += d * SEC_PER_TURN / 360;
    var steps = drag.acc > 0 ? Math.floor(drag.acc / STEP) : Math.ceil(drag.acc / STEP);
    if (steps !== 0) {
      drag.acc -= steps * STEP;
      var after = setRemaining(t, before + steps * STEP);
      if (after !== before) click();
      else drag.acc = 0;             // hit 00:00 or max: stop winding
    }
    if (t.remaining !== before || steps === 0) G.rot += d;
    jog.setAttribute("transform", "rotate(" + G.rot.toFixed(1) + " 100 100)");
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null; dial.classList.remove("scrubbing"); render();
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  svg.addEventListener("wheel", function (e) {
    e.preventDefault();
    var t = cur();
    if (t.running) pause(t);
    var dir = e.deltaY > 0 ? -1 : 1;
    G.rot += dir * 6;
    var before = t.remaining;
    if (setRemaining(t, Math.round(before) + dir * STEP) !== before) click();
  }, { passive: false });
  svg.addEventListener("keydown", function (e) {
    var t = cur(), dir = 0;
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") dir = -1;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") dir = 1;
    if (!dir) return;
    e.preventDefault();
    if (t.running) pause(t);
    G.rot += dir * 6;
    setRemaining(t, Math.round(t.remaining) + dir * STEP); click();
  });

  /* ---------- Buttons ---------- */
  goBtn.addEventListener("click", function () {
    audio();
    var t = cur();
    if (t.done) { var n = nextUp(t); loadPreset(t, n.min, n.mode); start(t); return; }
    if (t.running) pause(t); else start(t);
  });
  $("resetBtn").addEventListener("click", function () { var t = cur(); loadPreset(t, t.presetMin, t.mode); });
  $("presets").addEventListener("click", function (e) {
    var b = e.target.closest(".preset"); if (!b) return;
    loadPreset(cur(), +b.dataset.min, b.dataset.mode);
  });
  var nudges = document.querySelectorAll(".nudge");
  for (var i = 0; i < nudges.length; i++) {
    nudges[i].addEventListener("click", function () {
      audio();
      var t = cur();
      setRemaining(t, Math.round(rem(t)) + (+this.dataset.d));
    });
  }
  tabsEl.addEventListener("click", function (e) {
    var x = e.target.closest(".tab-x");
    if (x) {
      var k = +x.dataset.x;
      G.timers.splice(k, 1);
      recolor();
      if (G.sel >= G.timers.length) G.sel = G.timers.length - 1;
      render(); save(); return;
    }
    var tab = e.target.closest(".tab");
    if (tab) {
      G.sel = +tab.dataset.i;
      var t = cur(); if (t.done) { /* seeing it acknowledges it */ }
      render(); save();
    }
  });
  $("addBtn").addEventListener("click", function () {
    if (G.timers.length >= MAX_TIMERS) return;
    G.timers.push(newTimer(COLORS[G.timers.length], 25, "focus"));
    G.sel = G.timers.length - 1;
    render(); save();
  });
  $("soundBtn").addEventListener("click", function () {
    G.sound = !G.sound; store("sound", G.sound);
    if (G.sound) click();
    render();
  });
  var fsBtn = $("fsBtn");
  if (document.fullscreenEnabled) {
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", function () {
      var p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(function () {});
    });
  }
  document.addEventListener("keydown", function (e) {
    if (e.target === svg) return;
    if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); goBtn.click(); }
  });

  /* ---------- Boot ---------- */
  function boot(saved) {
    G.sound = load("sound", true);
    var st = (saved && saved.G) ? saved.G : load("timers", null);
    if (st && st.timers && st.timers.length) {
      G.timers = st.timers.slice(0, MAX_TIMERS);
      G.sel = Math.min(st.sel || 0, G.timers.length - 1);
      G.focusDone = st.focusDone || 0;
      if (typeof st.rot === "number") G.rot = st.rot;
    } else {
      G.timers = [newTimer("red", 25, "focus")];
      G.sel = 0;
    }
    recolor();
    // Timers that ran out while the page was closed finish quietly.
    G.timers.forEach(function (t) {
      if (t.running && t.endAt <= Date.now()) { t.endedAt = t.endAt; t.running = false; t.remaining = 0; t.done = true; }
    });
    if (anyRunning()) wake();
    render(); save();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () { return { G: G }; });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
