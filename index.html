<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro Dial</title>
<meta name="description" content="Touch Pomodoro timer with presets, a jog dial and quick minute nudges.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16110f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: one-screen kiosk for a 960×480 landscape panel — jog dial on the left, chunky controls on the right; stacks in portrait. */
:root {
  --bg: #16110f;
  --surface: #241c19;
  --raised: #33282400;
  --btn: #2e2420;
  --btn-press: #3d302b;
  --line: #4a3a33;
  --fg: #f5ebe4;
  --muted: #a8968b;
  --tomato: #ff5b3d;
  --leaf: #72c46f;
  --accent: var(--tomato);
  --font-digits: "Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-ui: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --gap: clamp(6px, 1.6vh, 12px);
  --dial: min(calc(100vh - 28px), 47vw);
  color-scheme: dark;
}
:root[data-mode="break"] { --accent: var(--leaf); }

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.app {
  height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: clamp(12px, 3vw, 32px);
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Dial ---------- */
.dial {
  position: relative;
  width: var(--dial);
  height: var(--dial);
  max-width: 100%;
}
.dial svg {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  cursor: grab;
}
.dial.scrubbing svg { cursor: grabbing; }
.bezel { fill: var(--surface); }
.bezel-edge { fill: none; stroke: var(--line); stroke-width: 1; }
.tick { stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; opacity: .55; }
.tick.major { stroke: var(--fg); stroke-width: 2; opacity: .8; }
.grip { fill: var(--accent); }
.track { fill: none; stroke: var(--btn); stroke-width: 7; }
.arc {
  fill: none;
  stroke: var(--accent);
  stroke-width: 7;
  stroke-linecap: round;
  transition: stroke-dashoffset .25s linear, stroke .3s;
}
.dial.scrubbing .arc { transition: none; }
.face { fill: var(--bg); }

.readout {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  gap: calc(var(--dial) * 0.015);
}
.mode-label {
  font-size: calc(var(--dial) * 0.058);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
}
.time {
  font-family: var(--font-digits);
  font-weight: 700;
  font-size: calc(var(--dial) * 0.2);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
.status {
  font-size: calc(var(--dial) * 0.052);
  font-weight: 500;
  color: var(--muted);
  min-height: 1.2em;
}
.dial.paused .time { animation: blink 1.4s steps(2, jump-none) infinite; }
.dial.done .time { color: var(--accent); }
@keyframes blink { 50% { opacity: .45; } }

.jog-hint {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(var(--dial) * -0.005);
  display: flex;
  justify-content: space-between;
  font-size: calc(var(--dial) * 0.042);
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  pointer-events: none;
}

/* ---------- Controls ---------- */
.controls {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  height: 100%;
  justify-content: center;
}
.top {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 40px;
}
.pips { display: flex; gap: 6px; align-items: center; }
.pip {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid var(--line);
  box-sizing: border-box;
}
.pip.on { background: var(--tomato); border-color: var(--tomato); }
.pip-label {
  font-size: 15px;
  color: var(--muted);
  font-weight: 500;
  white-space: nowrap;
}
.spacer { flex: 1; }

button {
  font: inherit;
  color: var(--fg);
  background: var(--btn);
  border: 1px solid var(--line);
  border-radius: 10px;
  min-height: 48px;
  cursor: pointer;
  touch-action: manipulation;
  transition: background .12s, transform .08s;
}
button:active { background: var(--btn-press); transform: scale(.97); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.icon-btn {
  min-height: 40px;
  min-width: 44px;
  padding: 0 10px;
  font-size: 15px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn[aria-pressed="false"] { color: var(--muted); }

.presets {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--gap);
}
.preset {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px 2px;
  min-height: clamp(48px, 13vh, 64px);
  line-height: 1.05;
}
.preset b { font-family: var(--font-digits); font-size: clamp(18px, 5vh, 24px); font-weight: 700; }
.preset span { font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.preset[aria-pressed="true"] span { color: var(--accent); }

.nudges {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--gap);
}
.nudge {
  font-family: var(--font-digits);
  font-weight: 700;
  font-size: clamp(17px, 4.6vh, 22px);
  min-height: clamp(48px, 12vh, 58px);
}
.nudge small { font-family: var(--font-ui); font-weight: 600; font-size: .7em; color: var(--muted); margin-left: 2px; }
.nudge.minus { background: var(--surface); }

.actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr);
  gap: var(--gap);
}
.reset { font-size: 19px; font-weight: 600; min-height: clamp(54px, 15vh, 72px); }
.go {
  background: var(--accent);
  border-color: var(--accent);
  color: #1b0f0b;
  font-size: clamp(20px, 5.6vh, 28px);
  font-weight: 700;
  letter-spacing: .04em;
  min-height: clamp(54px, 15vh, 72px);
}
.go:active { background: var(--accent); filter: brightness(.88); }

/* Portrait / phone */
@media (max-aspect-ratio: 1/1) {
  body { overflow-y: auto; }
  .app {
    grid-template-columns: minmax(0, 1fr);
    justify-items: center;
    height: auto;
    min-height: 100%;
    align-content: center;
  }
  .dial { --dial: min(86vw, 52vh); }
  .controls { width: 100%; max-width: 520px; height: auto; }
}

@media (prefers-reduced-motion: reduce) {
  .arc { transition: none; }
  .dial.paused .time { animation: none; }
  button:active { transform: none; }
}
</style>

</head>
<body>
<main class="app">
  <div class="dial" id="dial">
    <svg viewBox="0 0 200 200" id="dialSvg" role="slider" aria-label="Jog dial: turn clockwise to fast-forward, counter-clockwise to rewind" tabindex="0">
      <circle class="bezel" cx="100" cy="100" r="99"></circle>
      <circle class="bezel-edge" cx="100" cy="100" r="98.5"></circle>
      <g id="jog"></g>
      <circle class="face" cx="100" cy="100" r="82"></circle>
      <circle class="track" cx="100" cy="100" r="74"></circle>
      <circle class="arc" id="arc" cx="100" cy="100" r="74" transform="rotate(-90 100 100)"></circle>
    </svg>
    <div class="readout">
      <div class="mode-label" id="modeLabel">Focus</div>
      <div class="time" id="time">25:00</div>
      <div class="status" id="status">Ready</div>
    </div>
    <div class="jog-hint" aria-hidden="true"><span>↺ Rewind</span><span>Forward ↻</span></div>
  </div>

  <section class="controls" aria-label="Timer controls">
    <div class="top">
      <div class="pips" id="pips" aria-hidden="true">
        <i class="pip"></i><i class="pip"></i><i class="pip"></i><i class="pip"></i>
      </div>
      <span class="pip-label" id="pipLabel">0 done · long break after 4</span>
      <span class="spacer"></span>
      <button class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Sound">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
        <span id="soundTxt">On</span>
      </button>
      <button class="icon-btn" id="fsBtn" aria-label="Full screen" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
      </button>
    </div>

    <div class="presets" id="presets">
      <button class="preset" data-min="25" data-mode="focus" id="p25"><b>25</b><span>Focus</span></button>
      <button class="preset" data-min="50" data-mode="focus" id="p50"><b>50</b><span>Deep</span></button>
      <button class="preset" data-min="5" data-mode="break" id="p5"><b>5</b><span>Break</span></button>
      <button class="preset" data-min="15" data-mode="break" id="p15"><b>15</b><span>Long</span></button>
    </div>

    <div class="nudges">
      <button class="nudge minus" data-d="-60" id="m1">−1<small>min</small></button>
      <button class="nudge minus" data-d="-180" id="m3">−3<small>min</small></button>
      <button class="nudge minus" data-d="-300" id="m5">−5<small>min</small></button>
      <button class="nudge" data-d="60" id="a1">+1<small>min</small></button>
      <button class="nudge" data-d="180" id="a3">+3<small>min</small></button>
      <button class="nudge" data-d="300" id="a5">+5<small>min</small></button>
    </div>

    <div class="actions">
      <button class="reset" id="resetBtn">Reset</button>
      <button class="go" id="goBtn">Start</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var MAX = 99 * 60 + 59;
  var SEC_PER_TURN = 300;      // one full turn of the dial = 5 minutes
  var STEP = 5;                // dial moves in 5-second detents
  var R = 74, CIRC = 2 * Math.PI * R;

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var dial = $("dial"), svg = $("dialSvg"), jog = $("jog"), arc = $("arc");
  var timeEl = $("time"), statusEl = $("status"), modeLabel = $("modeLabel");
  var goBtn = $("goBtn");

  var S = {
    mode: "focus", presetMin: 25, total: 1500, remaining: 1500,
    running: false, endAt: 0, done: false, sessions: 0, sound: true, rot: 0
  };

  function store(k, v) { try { localStorage.setItem("pd_" + k, JSON.stringify(v)); } catch (e) {} }
  function load(k, d) { try { var v = localStorage.getItem("pd_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }

  /* ---------- Build jog ticks ---------- */
  (function buildTicks() {
    var ns = "http://www.w3.org/2000/svg", html = "";
    for (var i = 0; i < 60; i++) {
      var a = i * 6 * Math.PI / 180, major = i % 5 === 0;
      var r1 = major ? 85 : 87.5, r2 = 95;
      html += '<line class="tick' + (major ? " major" : "") + '" x1="' + (100 + r1 * Math.sin(a)).toFixed(2) +
        '" y1="' + (100 - r1 * Math.cos(a)).toFixed(2) + '" x2="' + (100 + r2 * Math.sin(a)).toFixed(2) +
        '" y2="' + (100 - r2 * Math.cos(a)).toFixed(2) + '"></line>';
    }
    html += '<circle class="grip" cx="100" cy="9.5" r="4.2"></circle>';
    jog.innerHTML = html;
    arc.setAttribute("stroke-dasharray", CIRC.toFixed(2));
  })();

  /* ---------- Audio ---------- */
  var ctx = null;
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, gain, type) {
    var c = audio(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function click() { if (S.sound) tone(1800, 0, 0.03, 0.06, "square"); }
  function chime() {
    if (!S.sound) return;
    var notes = [659, 784, 988];
    for (var rep = 0; rep < 3; rep++)
      for (var i = 0; i < 3; i++) tone(notes[i], rep * 1.1 + i * 0.18, 0.9, 0.25);
  }

  /* ---------- Wake lock ---------- */
  var lock = null;
  function wake() {
    if (!("wakeLock" in navigator) || lock) return;
    navigator.wakeLock.request("screen").then(function (l) {
      lock = l; l.addEventListener("release", function () { lock = null; });
    }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && S.running) wake();
  });

  /* ---------- Timer core ---------- */
  function rem() { return S.running ? Math.max(0, (S.endAt - Date.now()) / 1000) : S.remaining; }

  function setRemaining(r) {
    r = Math.max(0, Math.min(MAX, r));
    if (S.running) S.endAt = Date.now() + r * 1000; else S.remaining = r;
    if (r > S.total) S.total = r;
    if (r > 0) S.done = false;
    if (r === 0 && S.running) finish();
    render();
    return r;
  }

  function start() {
    audio();
    if (rem() <= 0) return;
    S.endAt = Date.now() + S.remaining * 1000;
    S.running = true; S.done = false;
    wake(); render();
  }
  function pause() {
    if (!S.running) return;
    S.remaining = Math.ceil(rem());
    S.running = false; render();
  }
  function finish() {
    S.running = false; S.remaining = 0; S.done = true;
    if (S.mode === "focus") { S.sessions++; store("sessions", S.sessions); }
    chime(); render();
  }
  function loadPreset(min, mode) {
    S.running = false; S.done = false;
    S.presetMin = min; S.mode = mode;
    S.total = S.remaining = min * 60;
    store("preset", { min: min, mode: mode });
    render();
  }
  function nextUp() {
    if (S.mode === "focus") return S.sessions % 4 === 0 ? { min: 15, mode: "break" } : { min: 5, mode: "break" };
    return { min: 25, mode: "focus" };
  }

  /* ---------- Render ---------- */
  var lastShown = "";
  function fmt(s) {
    var m = Math.floor(s / 60), x = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (x < 10 ? "0" : "") + x;
  }
  function render() {
    var r = rem();
    var shown = S.running ? Math.ceil(r - 1e-6) : Math.round(r);
    var txt = fmt(shown);
    if (txt !== lastShown) { timeEl.textContent = txt; lastShown = txt; document.title = (S.running ? txt + " · " : "") + "Pomodoro Dial"; }

    var frac = S.total > 0 ? Math.min(1, r / S.total) : 0;
    arc.setAttribute("stroke-dashoffset", (CIRC * (1 - frac)).toFixed(2));
    jog.setAttribute("transform", "rotate(" + S.rot.toFixed(1) + " 100 100)");

    root.setAttribute("data-mode", S.mode);
    modeLabel.textContent = S.mode === "focus" ? (S.presetMin >= 50 ? "Deep focus" : "Focus") : (S.presetMin >= 15 ? "Long break" : "Break");

    var paused = !S.running && !S.done && r < S.total;
    dial.classList.toggle("paused", paused);
    dial.classList.toggle("done", S.done);

    if (S.done) {
      statusEl.textContent = "Time’s up";
      var n = nextUp();
      goBtn.textContent = n.mode === "break" ? "Start " + n.min + "-min break" : "Start focus";
    } else if (S.running) {
      statusEl.textContent = S.mode === "focus" ? "Focusing" : "On break";
      goBtn.textContent = "Pause";
    } else if (paused) {
      statusEl.textContent = "Paused · turn dial to scrub";
      goBtn.textContent = "Resume";
    } else {
      statusEl.textContent = "Ready";
      goBtn.textContent = "Start";
    }

    var btns = document.querySelectorAll(".preset");
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      b.setAttribute("aria-pressed", (+b.dataset.min === S.presetMin && b.dataset.mode === S.mode) ? "true" : "false");
    }
    var pips = document.querySelectorAll(".pip"), filled = S.sessions % 4;
    if (S.sessions > 0 && filled === 0) filled = 4;
    for (var j = 0; j < pips.length; j++) pips[j].classList.toggle("on", j < filled);
    $("pipLabel").textContent = S.sessions + (S.sessions === 1 ? " pomodoro" : " pomodoros") + " today";

    $("soundBtn").setAttribute("aria-pressed", S.sound ? "true" : "false");
    $("soundTxt").textContent = S.sound ? "On" : "Off";
    $("waves").style.opacity = S.sound ? 1 : 0;
    svg.setAttribute("aria-valuetext", txt + " remaining");
  }

  setInterval(function () {
    if (S.running) { if (rem() <= 0) finish(); else render(); }
  }, 250);

  /* ---------- Dial gesture ---------- */
  var drag = null;
  function angleOf(e) {
    var b = svg.getBoundingClientRect();
    return Math.atan2(e.clientY - (b.top + b.height / 2), e.clientX - (b.left + b.width / 2)) * 180 / Math.PI;
  }
  svg.addEventListener("pointerdown", function (e) {
    audio();
    if (S.running) pause();
    if (S.done) S.done = false;
    S.remaining = Math.round(S.remaining);
    drag = { id: e.pointerId, last: angleOf(e), acc: 0 };
    try { svg.setPointerCapture(e.pointerId); } catch (x) {}
    dial.classList.add("scrubbing");
    e.preventDefault();
  });
  svg.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var a = angleOf(e), d = a - drag.last;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    drag.last = a;
    // clockwise (d > 0) = fast-forward = less time left; counter-clockwise = rewind
    var before = S.remaining;
    drag.acc -= d * SEC_PER_TURN / 360;
    var steps = drag.acc > 0 ? Math.floor(drag.acc / STEP) : Math.ceil(drag.acc / STEP);
    if (steps !== 0) {
      drag.acc -= steps * STEP;
      var after = setRemaining(before + steps * STEP);
      if (after !== before) click();
      else drag.acc = 0;             // hit 00:00 or max: stop winding
    }
    if (S.remaining !== before || steps === 0) S.rot += d;
    jog.setAttribute("transform", "rotate(" + S.rot.toFixed(1) + " 100 100)");
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null; dial.classList.remove("scrubbing"); render();
  }
  svg.addEventListener("pointerup", endDrag);
  svg.addEventListener("pointercancel", endDrag);
  svg.addEventListener("wheel", function (e) {
    e.preventDefault();
    if (S.running) pause();
    var dir = e.deltaY > 0 ? -1 : 1;
    S.rot -= dir * 6;
    var before = S.remaining;
    if (setRemaining(Math.round(before) + dir * STEP) !== before) click();
  }, { passive: false });
  svg.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); if (S.running) pause(); S.rot -= 6; setRemaining(Math.round(S.remaining) + STEP); click(); }
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); if (S.running) pause(); S.rot += 6; setRemaining(Math.round(S.remaining) - STEP); click(); }
  });

  /* ---------- Buttons ---------- */
  goBtn.addEventListener("click", function () {
    audio();
    if (S.done) { var n = nextUp(); loadPreset(n.min, n.mode); start(); return; }
    if (S.running) pause(); else start();
  });
  $("resetBtn").addEventListener("click", function () { loadPreset(S.presetMin, S.mode); });
  $("presets").addEventListener("click", function (e) {
    var b = e.target.closest(".preset"); if (!b) return;
    loadPreset(+b.dataset.min, b.dataset.mode);
  });
  var nudges = document.querySelectorAll(".nudge");
  for (var i = 0; i < nudges.length; i++) {
    nudges[i].addEventListener("click", function () {
      audio();
      var r = setRemaining(Math.round(rem()) + (+this.dataset.d));
      if (r === 0 && !S.running && !S.done) render();
    });
  }
  $("soundBtn").addEventListener("click", function () {
    S.sound = !S.sound; store("sound", S.sound);
    if (S.sound) click();
    render();
  });
  var fsBtn = $("fsBtn");
  if (document.fullscreenEnabled) {
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", function () {
      var p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(function () {});
    });
  }
  document.addEventListener("keydown", function (e) {
    if (e.target === svg) return;
    if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); goBtn.click(); }
  });

  /* ---------- Boot ---------- */
  function boot(saved) {
    S.sound = load("sound", true);
    var day = new Date().toDateString();
    if (load("day", "") !== day) { store("day", day); store("sessions", 0); }
    S.sessions = load("sessions", 0);
    var p = load("preset", { min: 25, mode: "focus" });
    S.presetMin = p.min; S.mode = p.mode; S.total = S.remaining = p.min * 60;
    if (saved && saved.S) {
      for (var k in saved.S) S[k] = saved.S[k];
      if (S.running) wake();
    }
    render();
  }
  if (window.claude && window.claude.hot) {
    window.claude.hot.snapshot && window.claude.hot.snapshot(function () { return { S: S }; });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();
</script>

  });
