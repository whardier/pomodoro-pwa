<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pomodoro Dial</title>
<meta name="description" content="Touch Pomodoro timer with presets, a jog dial and quick minute nudges.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16110f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
*, *::before, *::after { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: one-screen kiosk for a 960×480 landscape panel — jog dial on the left, timer tabs + chunky controls on the right; stacks in portrait. */
:root {
  --bg: #16110f;
  --surface: #241c19;
  --btn: #2e2420;
  --btn-press: #3d302b;
  --line: #4a3a33;
  --fg: #f5ebe4;
  --fg-dim: #7b7672;   /* --fg at half brightness, for the seconds */
  --muted: #a8968b;
  --ink: #1b0f0b;
  /* timer colors, always assigned in this order: 1 red, 2 orange, 3 yellow, 4 green, 5 blue */
  --red: #ff4b4b;
  --orange: #ff8c32;
  --yellow: #ffd23f;
  --green: #5ccf6a;
  --blue: #4aa6ff;
  /* each at half brightness: the page background while a finished timer waits */
  --red-dim: #802626;
  --orange-dim: #804619;
  --yellow-dim: #806920;
  --green-dim: #2e6835;
  --blue-dim: #255380;
  --accent: var(--red);
  --accent-dim: var(--red-dim);
  --font-digits: "Azeret Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-ui: "Barlow Semi Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --gap: clamp(6px, 1.6vh, 12px);
  --dial: min(calc(100vh - 28px), 47vw);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  overflow: hidden;
  transition: background .6s ease;
}
/* Time's up: the whole page goes to the accent at half brightness until the time is touched. */
body.alarm { background: var(--accent-dim); }
body {
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.app {
  height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: clamp(12px, 3vw, 32px);
  padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- Star field ----------
   Three tiled layers drifting on CSS transforms: composited on the GPU, no per-frame script. */
.stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}
.layer {
  position: absolute;
  top: 0; left: 0;
  width: calc(100% + 512px);
  height: calc(100% + 512px);
  background-repeat: repeat;
  background-size: 512px 512px;
  will-change: transform;
  backface-visibility: hidden;
  animation: drift linear infinite;
}
.l1 { animation-duration: 360s; opacity: .7; }
.l2 { animation-duration: 220s; opacity: .85; }
.l3 { animation-duration: 140s; }
@keyframes drift {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(-512px, -512px, 0); }
}
.app { position: relative; z-index: 1; }

/* ---------- Dial ----------
   Two stacked SVGs: the tick ring rotates as one GPU-composited layer (CSS transform),
   the face/arc above it only repaints when the remaining time changes. */
.dial {
  position: relative;
  width: var(--dial);
  height: var(--dial);
  max-width: 100%;
  touch-action: none;
  cursor: grab;
}
.dial.scrubbing { cursor: grabbing; }
.dial svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.ring {
  will-change: transform;
  transform: rotate(0deg);
  backface-visibility: hidden;
}
.face-svg { pointer-events: none; }
/* Accent copy of the ring: hidden until the last quarter of the preset, breathing in the last minute.
   Opacity on its own composited layer, so neither state repaints the SVG. */
.ring-accent {
  will-change: transform, opacity;
  opacity: 0;
  transition: opacity .6s ease;
}
.ring-accent .bezel-edge { stroke: var(--accent); stroke-width: 2.5; }
.ring-accent .tick { stroke: var(--accent); opacity: .85; }
.ring-accent .tick.major { stroke: var(--accent); opacity: 1; }
.dial.warn .ring-accent { opacity: 1; }
.dial.final .ring-accent { animation: breathe 3.2s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { opacity: .12; }
  50%      { opacity: 1; }
}
/* The bezel is an open ring (82–99), so the page background shows through the face. */
.bezel { fill: none; stroke: var(--surface); stroke-width: 17; }
.bezel-edge { fill: none; stroke: var(--line); stroke-width: 1; }
.tick { stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; opacity: .55; }
.tick.major { stroke: var(--fg); stroke-width: 2; opacity: .8; }
.grip { fill: var(--accent); transition: fill .3s; }
.track { fill: none; stroke: var(--btn); stroke-width: 7; }
.arc {
  fill: none;
  stroke: var(--accent);
  stroke-width: 7;
  stroke-linecap: round;
  transition: stroke .3s;
}
.face { fill: none; }

.readout {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  gap: calc(var(--dial) * 0.015);
}
.mode-label {
  font-size: calc(var(--dial) * 0.058);
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent);
  transition: color .3s;
}
.time {
  display: flex;
  align-items: baseline;
  justify-content: center;
  font-family: var(--font-digits);
  font-weight: 700;
  font-size: calc(var(--dial) * 0.2);
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.02em;
}
/* Colon and seconds sit back: half-bright and half-transparent. (No layer promotion here:
   Safari ghosts the minutes when composited spans sit inside the blinking time block.) */
.colon, .ss {
  color: var(--fg-dim);
  opacity: .5;
}
/* Past 99 minutes the minutes keep full size; colon and seconds shrink to make room. */
.time.wide .colon, .time.wide .ss { font-size: .5em; }
.time.wide .colon { margin: 0 .05em; }
.status {
  font-size: calc(var(--dial) * 0.052);
  font-weight: 500;
  color: var(--muted);
  min-height: 1.2em;
}
.dial.paused .time { animation: blink 1.4s steps(2, jump-none) infinite; }
.dial.done .time { color: var(--accent); }
.dial.done .colon, .dial.done .ss { color: var(--accent); }
@keyframes blink { 50% { opacity: .45; } }

/* ---------- Controls ---------- */
.controls {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
  height: 100%;
  justify-content: center;
}

button {
  font: inherit;
  color: var(--fg);
  background: var(--btn);
  border: 1px solid var(--line);
  border-radius: 10px;
  min-height: 48px;
  cursor: pointer;
  touch-action: manipulation;
  transition: background .12s, transform .08s, border-color .2s;
}
button:active { background: var(--btn-press); transform: scale(.97); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Target end time */
/* Clock block: current time over the end time. Everything is anchored to the right edge,
   so a longer label, a 2-digit hour or a day tag never shifts the digits. */
.eta {
  display: grid;
  grid-template-columns: minmax(0, 1fr) max-content max-content;
  column-gap: 10px;
  row-gap: 2px;
  align-items: baseline;
  justify-items: end;
  text-align: right;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
}
.eta-label { grid-column: 1; }
.eta-day { grid-column: 2; }      /* "tomorrow" sits before the time, so the digits' right edge never moves */
.eta-time { grid-column: 3; }
.eta-label {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.eta-time {
  font-family: var(--font-digits);
  font-weight: 700;
  font-size: clamp(18px, 5vh, 24px);
  font-variant-numeric: tabular-nums;
  color: var(--accent);
  transition: color .3s;
}
.eta-time.now { color: var(--fg); }
.eta-day { font-size: 15px; font-weight: 600; color: var(--muted); }

/* Timer tabs */
.top {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.tabs {
  display: flex;
  gap: 6px;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 3px;
  margin: -3px;
}
.tabs::-webkit-scrollbar { display: none; }
/* Three fixed timers. Idle tabs sit dim; a running or expired tab fills with its colour at
   half brightness; the selected tab carries an outline in its colour. */
.tab {
  --c: var(--red);
  --c-dim: var(--red-dim);
  flex: 1 1 0;
  min-width: 0;
  min-height: 46px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-family: var(--font-digits);
  font-weight: 700;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  background: var(--surface);
  opacity: .5;
  transition: background .3s, opacity .3s, border-color .2s;
}
.tab .dot {
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid var(--c);
  box-sizing: border-box;
  flex: 0 0 auto;
}
.tab.running, .tab.done {
  opacity: 1;
  color: var(--fg);
  background: var(--c-dim);
}
.tab.running .dot, .tab.done .dot { background: var(--c); }
.tab[aria-selected="true"] {
  opacity: 1;
  border-color: var(--c);
  box-shadow: inset 0 0 0 1px var(--c);
}
/* Mirrors the outer ring: last quarter = bold outline in the timer's colour; last minute = it breathes. */
.tab { position: relative; }
.tab::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  box-shadow: inset 0 0 0 2.5px var(--c);
  opacity: 0;
  pointer-events: none;
  will-change: opacity;
}
.tab.warn { opacity: 1; color: var(--c); border-color: var(--c); }
.tab.warn::after { opacity: 1; }
.tab.final::after { animation: breathe 3.2s ease-in-out infinite; }
.icon-btn {
  flex: 0 0 auto;
  min-height: 46px;
  min-width: 46px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn[aria-pressed="false"] { color: var(--muted); }
.add-btn { font-size: 26px; font-weight: 500; line-height: 1; }

.presets {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--gap);
}
.preset {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px 2px;
  min-height: clamp(48px, 13vh, 64px);
  line-height: 1.05;
}
.preset b { font-family: var(--font-digits); font-size: clamp(18px, 5vh, 24px); font-weight: 700; }
.preset span { font-size: 14px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.preset[aria-pressed="true"] span { color: var(--accent); }

.nudges {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: var(--gap);
}
.nudge {
  font-family: var(--font-digits);
  font-weight: 700;
  font-size: clamp(17px, 4.6vh, 22px);
  min-height: clamp(48px, 12vh, 58px);
}
.nudge small { font-family: var(--font-ui); font-weight: 600; font-size: .7em; color: var(--muted); margin-left: 2px; }
.nudge.minus { background: var(--surface); }

.actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr);
  gap: var(--gap);
}
.reset { font-size: 19px; font-weight: 600; min-height: clamp(54px, 15vh, 72px); }
.go {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--ink);
  font-size: clamp(20px, 5.6vh, 28px);
  font-weight: 700;
  letter-spacing: .04em;
  min-height: clamp(54px, 15vh, 72px);
  transition: background .3s, border-color .3s, transform .08s;
}
.go:active { background: var(--accent); filter: brightness(.88); }

/* Portrait / phone: dial on top, controls below, everything on one screen.
   Button rows are tightened and the dial takes whatever height is left (set by script). */
@media (max-aspect-ratio: 1/1) {
  body { overflow-y: auto; }
  .app {
    --gap: 8px;
    grid-template-columns: minmax(0, 1fr);
    justify-items: center;
    gap: 10px;
    height: auto;
    min-height: 100%;
    align-content: center;
  }
  .dial { --dial: min(86vw, 42vh); }
  .controls { width: 100%; max-width: 520px; height: auto; }
  .eta-time { font-size: 20px; }
  .tab, .icon-btn { min-height: 42px; }
  .preset { min-height: 52px; }
  .preset b { font-size: 20px; }
  .nudge { min-height: 46px; font-size: 18px; }
  .reset, .go { min-height: 54px; }
  .go { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  .layer { animation: none; }
  .dial.final .ring-accent, .tab.final::after { animation: none; opacity: 1; }
  .arc { transition: none; }
  .dial.paused .time { animation: none; }
  button:active { transform: none; }
}
</style>

<div class="stars" id="stars" aria-hidden="true">
  <div class="layer l1" id="l1"></div>
  <div class="layer l2" id="l2"></div>
  <div class="layer l3" id="l3"></div>
</div>

</head>
<body>
<main class="app">
  <div class="dial" id="dial" role="slider" aria-label="Jog dial: turn clockwise to add time, counter-clockwise to remove time" tabindex="0">
    <svg class="ring" viewBox="0 0 200 200" id="ring" aria-hidden="true">
      <circle class="bezel" cx="100" cy="100" r="90.5"></circle>
      <circle class="bezel-edge" cx="100" cy="100" r="98.5"></circle>
      <g id="jog"></g>
    </svg>
    <svg class="ring ring-accent" viewBox="0 0 200 200" id="ringAccent" aria-hidden="true">
      <circle class="bezel-edge" cx="100" cy="100" r="98.5"></circle>
      <g id="jogAccent"></g>
    </svg>
    <svg class="face-svg" viewBox="0 0 200 200" aria-hidden="true">
      <circle class="face" cx="100" cy="100" r="82"></circle>
      <circle class="track" cx="100" cy="100" r="74"></circle>
      <circle class="arc" id="arc" cx="100" cy="100" r="74" transform="rotate(-90 100 100)"></circle>
    </svg>
    <div class="readout">
      <div class="mode-label" id="modeLabel">Focus</div>
      <div class="time" id="time"><span class="mm" id="mm">25</span><span class="colon">:</span><span class="ss" id="ss">00</span></div>
      <div class="status" id="status">Ready</div>
    </div>
  </div>

  <section class="controls" aria-label="Timer controls">
    <div class="eta" id="eta" aria-live="off">
      <span class="eta-label">Now</span>
      <span class="eta-day"></span>
      <span class="eta-time now" id="nowTime">--:--:--</span>
      <span class="eta-label" id="etaLabel">Ends at</span>
      <span class="eta-day" id="etaDay"></span>
      <span class="eta-time" id="etaTime">--:--</span>
    </div>
    <div class="top">
      <div class="tabs" id="tabs" role="tablist" aria-label="Timers"></div>
      <button class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Sound">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"></path><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
      </button>
      <button class="icon-btn" id="fsBtn" aria-label="Full screen" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
      </button>
    </div>

    <div class="presets" id="presets">
      <button class="preset" data-min="25" data-mode="focus" id="p25"><b>25</b><span>Focus</span></button>
      <button class="preset" data-min="50" data-mode="focus" id="p50"><b>50</b><span>Deep</span></button>
      <button class="preset" data-min="5" data-mode="break" id="p5"><b>5</b><span>Break</span></button>
      <button class="preset" data-min="15" data-mode="break" id="p15"><b>15</b><span>Long</span></button>
    </div>

    <div class="nudges">
      <button class="nudge minus" data-d="-60" id="m1">−1<small>min</small></button>
      <button class="nudge minus" data-d="-180" id="m3">−3<small>min</small></button>
      <button class="nudge minus" data-d="-300" id="m5">−5<small>min</small></button>
      <button class="nudge" data-d="60" id="a1">+1<small>min</small></button>
      <button class="nudge" data-d="180" id="a3">+3<small>min</small></button>
      <button class="nudge" data-d="300" id="a5">+5<small>min</small></button>
    </div>

    <div class="actions">
      <button class="reset" id="resetBtn">Reset</button>
      <button class="go" id="goBtn">Start</button>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var MAX = 999 * 60 + 59;    // display tops out at 999:59
  var SEC_PER_TURN = 300;      // one full turn of the dial = 5 minutes
  var STEP = 5;                // dial moves in 5-second detents
  var TIMERS = 3;             // always exactly three: red, orange, yellow
  var COLORS = ["red", "orange", "yellow", "green", "blue"];
  var R = 74, CIRC = 2 * Math.PI * R;

  var $ = function (id) { return document.getElementById(id); };
  var root = document.documentElement;
  var dial = $("dial"), ring = $("ring"), ringAccent = $("ringAccent"), jog = $("jog"), arc = $("arc");
  var timeEl = $("time"), statusEl = $("status"), modeLabel = $("modeLabel");
  var goBtn = $("goBtn"), tabsEl = $("tabs");
  var presetEls = document.querySelectorAll(".preset");

  var G = { timers: [], sel: 0, sound: true, rot: 0, focusDone: 0 };

  function store(k, v) { try { localStorage.setItem("pd_" + k, JSON.stringify(v)); } catch (e) {} }
  function load(k, d) { try { var v = localStorage.getItem("pd_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function save() { store("timers", { timers: G.timers, sel: G.sel, focusDone: G.focusDone }); }

  function newTimer(color, min, mode) {
    return { color: color, mode: mode || "focus", presetMin: min || 25, total: (min || 25) * 60,
             remaining: (min || 25) * 60, running: false, endAt: 0, done: false };
  }
  function cur() { return G.timers[G.sel]; }
  // Colors follow slot order, so timer 1 is always red, timer 2 orange, and so on.
  function recolor() { G.timers.forEach(function (t, i) { t.color = COLORS[i % COLORS.length]; }); }

  /* ---------- Build jog ticks ---------- */
  (function buildTicks() {
    var html = "";
    for (var i = 0; i < 60; i++) {
      var a = i * 6 * Math.PI / 180, major = i % 5 === 0;
      var r1 = major ? 85 : 87.5, r2 = 95;
      html += '<line class="tick' + (major ? " major" : "") + '" x1="' + (100 + r1 * Math.sin(a)).toFixed(2) +
        '" y1="' + (100 - r1 * Math.cos(a)).toFixed(2) + '" x2="' + (100 + r2 * Math.sin(a)).toFixed(2) +
        '" y2="' + (100 - r2 * Math.cos(a)).toFixed(2) + '"></line>';
    }
    $("jogAccent").innerHTML = html;
    html += '<circle class="grip" cx="100" cy="9.5" r="4.2"></circle>';
    jog.innerHTML = html;
    arc.setAttribute("stroke-dasharray", CIRC.toFixed(2));
  })();

  /* ---------- Star tiles ---------- */
  // One 512px tile per layer, drawn once on a canvas and used as a repeating background.
  function starTile(count, maxR, bright) {
    var c = document.createElement("canvas"); c.width = c.height = 512;
    var g = c.getContext("2d"); if (!g) return "";
    for (var i = 0; i < count; i++) {
      var r = 0.4 + Math.random() * maxR, a = bright * (0.35 + Math.random() * 0.65);
      var warm = Math.random() < 0.25;
      g.fillStyle = warm ? "rgba(255,222,190," + a.toFixed(2) + ")" : "rgba(220,235,255," + a.toFixed(2) + ")";
      g.beginPath(); g.arc(Math.random() * 512, Math.random() * 512, r, 0, Math.PI * 2); g.fill();
    }
    try { return "url(" + c.toDataURL("image/png") + ")"; } catch (e) { return ""; }
  }
  function buildStars() {
    $("l1").style.backgroundImage = starTile(150, 0.8, 0.85);
    $("l2").style.backgroundImage = starTile(80, 1.2, 1.0);
    $("l3").style.backgroundImage = starTile(30, 1.8, 1.0);
  }

  /* ---------- Audio ---------- */
  var ctx = null;
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, gain, type) {
    var c = audio(); if (!c) return;
    var o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  }
  // Each color gets its own chime pitch so you can tell timers apart by ear.
  var CHIME_BASE = { red: 523, orange: 587, yellow: 659, green: 784, blue: 880 };  // rising with timer number
  function chime(color) {
    if (!G.sound) return;
    var b = CHIME_BASE[color] || 659, notes = [b, b * 1.189, b * 1.498];
    for (var rep = 0; rep < 3; rep++)
      for (var i = 0; i < 3; i++) tone(notes[i], rep * 1.1 + i * 0.18, 0.9, 0.25);
  }

  /* ---------- Wake lock ---------- */
  var lock = null;
  function anyRunning() { for (var i = 0; i < G.timers.length; i++) if (G.timers[i].running) return true; return false; }
  function wake() {
    if (!("wakeLock" in navigator) || lock) return;
    navigator.wakeLock.request("screen").then(function (l) {
      lock = l; l.addEventListener("release", function () { lock = null; });
    }).catch(function () {});
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && anyRunning()) wake();
  });

  /* ---------- Timer core ---------- */
  function rem(t) { return t.running ? Math.max(0, (t.endAt - Date.now()) / 1000) : t.remaining; }

  function setRemaining(t, r, light) {
    r = Math.max(0, Math.min(MAX, r));
    if (t.running) t.endAt = Date.now() + r * 1000; else t.remaining = r;
    if (r > t.total) t.total = r;
    if (r > 0) t.done = false;
    if (r === 0 && t.running) finish(t);
    if (light) renderLight(t); else { render(); save(); }
    return r;
  }
  function start(t) {
    audio();
    if (rem(t) <= 0) return;
    t.endAt = Date.now() + t.remaining * 1000;
    t.running = true; t.done = false;
    wake(); render(); save();
  }
  function pause(t) {
    if (!t.running) return;
    t.remaining = Math.ceil(rem(t));
    t.running = false; render(); save();
  }
  function finish(t) {
    t.endedAt = t.running ? Math.min(t.endAt, Date.now()) : Date.now();
    t.running = false; t.remaining = 0; t.done = true;
    if (t.mode === "focus") G.focusDone++;
    chime(t.color);
    if (!drag) G.sel = G.timers.indexOf(t);   // bring the finished timer to the dial
    render(); save();
  }
  function loadPreset(t, min, mode) {
    t.running = false; t.done = false;
    t.presetMin = min; t.mode = mode;
    t.total = t.remaining = min * 60;
    render(); save();
  }
  function nextUp(t) {
    if (t.mode === "focus") return G.focusDone > 0 && G.focusDone % 4 === 0 ? { min: 15, mode: "break" } : { min: 5, mode: "break" };
    return { min: 25, mode: "focus" };
  }

  /* ---------- Render ---------- */
  function fmt(s) {
    var m = Math.floor(s / 60), x = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (x < 10 ? "0" : "") + x;
  }
  function shown(t) { var r = rem(t); return t.running ? Math.ceil(r - 1e-6) : Math.round(r); }
  function labelFor(t) {
    return t.mode === "focus" ? (t.presetMin >= 50 ? "Deep focus" : "Focus") : (t.presetMin >= 15 ? "Long break" : "Break");
  }

  var tabSig = "", tabEls = [];
  function renderTabs() {
    var sig = G.timers.map(function (t) { return t.color; }).join() + "|" + G.sel;
    if (sig !== tabSig) {
      tabSig = sig;
      var html = "";
      G.timers.forEach(function (t, i) {
        html += '<button class="tab" role="tab" data-i="' + i + '" style="--c: var(--' + t.color + '); --c-dim: var(--' + t.color + '-dim)" aria-label="' +
          t.color + ' timer"><i class="dot"></i><span></span></button>';
      });
      tabsEl.innerHTML = html;
      tabEls = [];
      var found = tabsEl.querySelectorAll(".tab");
      for (var k = 0; k < found.length; k++) tabEls.push({ el: found[k], sp: found[k].lastChild, txt: "", sel: null, run: null, done: null, warn: null, fin: null });
    }
    for (var i = 0; i < tabEls.length; i++) {
      var t = G.timers[i], c = tabEls[i], txt = fmt(shown(t));
      var sel = i === G.sel, done = t.done, r = rem(t);
      var warn = r <= t.presetMin * 60 * 0.25, fin = warn && r <= 60 && !done;
      if (c.warn !== warn) { c.el.classList.toggle("warn", warn); c.warn = warn; }
      if (c.fin !== fin) { c.el.classList.toggle("final", fin); c.fin = fin; }
      if (c.txt !== txt) { c.sp.textContent = txt; c.txt = txt; }
      if (c.sel !== sel) { c.el.setAttribute("aria-selected", sel ? "true" : "false"); c.sel = sel; }
      if (c.run !== t.running) { c.el.classList.toggle("running", t.running); c.run = t.running; }
      if (c.done !== done) { c.el.classList.toggle("done", done); c.done = done; }
    }
  }

  // Local wall-clock time the selected timer will hit 00:00. While paused or not yet
  // started it is "now + time left", so it keeps sliding later every second.
  var etaLabel = $("etaLabel"), etaTime = $("etaTime"), etaDay = $("etaDay");
  // Building an Intl formatter is the slow part on low-end devices, so build each once.
  var timeFmt = null, dayFmt = null;
  try { timeFmt = new Intl.DateTimeFormat([], { hour: "numeric", minute: "2-digit", second: "2-digit" }); } catch (e) {}
  try { dayFmt = new Intl.DateTimeFormat([], { weekday: "short" }); } catch (e) {}
  function clock(ms) {
    if (timeFmt) return timeFmt.format(ms);
    var d = new Date(ms);
    return d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2);
  }
  function dayTag(ms) {
    var d = new Date(ms), now = new Date();
    if (d.toDateString() === now.toDateString()) return "";
    var tmr = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    if (d.toDateString() === tmr.toDateString()) return "tomorrow";
    return dayFmt ? dayFmt.format(d) : "";
  }
  var nowTime = $("nowTime"), nowSec = -1;
  function renderNow() {
    var ms = Date.now(), sec = Math.floor(ms / 1000);
    if (sec === nowSec) return;
    nowSec = sec; nowTime.textContent = clock(ms);
  }
  var etaSec = -1, etaLbl = "";
  function renderEta(t, r, paused) {
    var label, at;
    if (t.done) { label = "Ended at"; at = t.endedAt || Date.now(); }
    else if (t.running) { label = "Ends at"; at = t.endAt; }
    else { label = paused ? "Resume now, ends" : "Start now, ends"; at = Date.now() + Math.round(r) * 1000; }
    var sec = Math.floor(at / 1000);
    if (sec === etaSec && label === etaLbl) return;   // nothing visible changed
    etaSec = sec; etaLbl = label;
    var txt = clock(at), day = dayTag(at);
    if (etaLabel.textContent !== label) etaLabel.textContent = label;
    if (etaTime.textContent !== txt) etaTime.textContent = txt;
    if (etaDay.textContent !== day) etaDay.textContent = day;
  }

  var lastRot = null;
  function setRot() {
    var v = G.rot.toFixed(1);
    if (v !== lastRot) {
      var tr = "rotate(" + v + "deg)";
      ring.style.transform = tr; ringAccent.style.transform = tr; lastRot = v;
    }
  }
  var lastDash = "";
  function setArc(t, r) {
    var frac = t.total > 0 ? Math.min(1, r / t.total) : 0;
    var v = (CIRC * (1 - frac)).toFixed(2);
    if (v !== lastDash) { arc.setAttribute("stroke-dashoffset", v); lastDash = v; }
  }
  var mmEl = $("mm"), ssEl = $("ss"), lastMM = "", lastSS = "", lastWide = null, lastShown = "";
  function setDigits(sec) {
    var m = Math.floor(sec / 60), x = sec % 60;
    var ms = (m < 10 ? "0" : "") + m, xs = (x < 10 ? "0" : "") + x;
    if (ms !== lastMM) { mmEl.textContent = ms; lastMM = ms; }
    if (xs !== lastSS) { ssEl.textContent = xs; lastSS = xs; }
    var wide = m >= 100;
    if (wide !== lastWide) { timeEl.classList.toggle("wide", wide); lastWide = wide; }
    var txt = ms + ":" + xs;
    if (txt !== lastShown) { lastShown = txt; dial.setAttribute("aria-valuetext", txt + " remaining"); }
    return txt;
  }
  // Outer ring: accent on for the last quarter of the preset, breathing for the last minute.
  var lastWarn = null, lastFinal = null;
  function setRingState(t, r) {
    var warn = r <= t.presetMin * 60 * 0.25;
    var fin = warn && r <= 60 && !t.done;
    if (warn !== lastWarn) { dial.classList.toggle("warn", warn); lastWarn = warn; }
    if (fin !== lastFinal) { dial.classList.toggle("final", fin); lastFinal = fin; }
  }
  var lastDone = null;
  function setDone(t) {
    if (t.done === lastDone) return;
    dial.classList.toggle("done", t.done);
    document.body.classList.toggle("alarm", t.done);
    lastDone = t.done;
  }
  // Only what moves while the finger is on the dial.
  function renderLight(t) {
    var r = rem(t);
    setDone(t);
    setDigits(shown(t));
    setArc(t, r);
    setRingState(t, r);
    renderEta(t, r, !t.running && !t.done && r < t.total);
  }

  var lastColor = "", lastTitle = "", lastMode = "", lastStatus = "", lastGo = "", lastPaused = null;
  function render() {
    var t = cur(), r = rem(t), txt = setDigits(shown(t));
    var title = anyRunning() ? txt + " · Pomodoro Dial" : "Pomodoro Dial";
    if (title !== lastTitle) { document.title = title; lastTitle = title; }

    if (t.color !== lastColor) {
      root.style.setProperty("--accent", "var(--" + t.color + ")");
      root.style.setProperty("--accent-dim", "var(--" + t.color + "-dim)");
      lastColor = t.color;
    }
    setArc(t, r);
    setRingState(t, r);
    setRot();
    var ml = labelFor(t);
    if (ml !== lastMode) { modeLabel.textContent = ml; lastMode = ml; }

    var paused = !t.running && !t.done && r < t.total;
    if (paused !== lastPaused) { dial.classList.toggle("paused", paused); lastPaused = paused; }
    setDone(t);

    var st, go;
    if (t.done) {
      st = "Time’s up";
      var n = nextUp(t);
      go = n.mode === "break" ? "Start " + n.min + "-min break" : "Start focus";
    } else if (t.running) { st = t.mode === "focus" ? "Focusing" : "On break"; go = "Pause"; }
    else if (paused) { st = "Paused · turn dial to adjust"; go = "Resume"; }
    else { st = "Ready"; go = "Start"; }
    if (st !== lastStatus) { statusEl.textContent = st; lastStatus = st; }
    if (go !== lastGo) { goBtn.textContent = go; lastGo = go; }

    renderEta(t, r, paused);

    for (var i = 0; i < presetEls.length; i++) {
      var b = presetEls[i];
      var on = (+b.dataset.min === t.presetMin && b.dataset.mode === t.mode) ? "true" : "false";
      if (b.getAttribute("aria-pressed") !== on) b.setAttribute("aria-pressed", on);
    }
    renderTabs();
  }
  function renderSound() {
    $("soundBtn").setAttribute("aria-pressed", G.sound ? "true" : "false");
    $("waves").style.opacity = G.sound ? 1 : 0;
  }

  setInterval(function () {
    renderNow();
    for (var i = 0; i < G.timers.length; i++) {
      var t = G.timers[i];
      if (t.running && rem(t) <= 0) finish(t);
    }
    if (drag) { renderLight(cur()); return; }   // the gesture handler paints the rest
    render();           // a paused timer's end time keeps moving out
  }, 250);

  /* ---------- Dial gesture ---------- */
  var drag = null;
  // The dial centre is measured once per gesture, so a move never forces layout.
  function angleAt(e, c) { return Math.atan2(e.clientY - c.y, e.clientX - c.x) * 180 / Math.PI; }
  dial.addEventListener("pointerdown", function (e) {
    audio();
    var t = cur();
    if (t.running) pause(t);
    if (t.done) t.done = false;
    t.remaining = Math.round(t.remaining);
    var b = dial.getBoundingClientRect();
    var c = { x: b.left + b.width / 2, y: b.top + b.height / 2 };
    drag = { id: e.pointerId, c: c, last: angleAt(e, c), acc: 0 };
    try { dial.setPointerCapture(e.pointerId); } catch (x) {}
    dial.classList.add("scrubbing");
    e.preventDefault();
  });
  dial.addEventListener("pointermove", function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var t = cur();
    var a = angleAt(e, drag.c), d = a - drag.last;
    if (d > 180) d -= 360; else if (d < -180) d += 360;
    drag.last = a;
    // clockwise (d > 0) adds time; counter-clockwise removes time

    if ((before <= 0 && d < 0) || (before >= MAX && d > 0)) { drag.acc = 0; return; }
    drag.acc += d * SEC_PER_TURN / 360;
    var steps = drag.acc > 0 ? Math.floor(drag.acc / STEP + 1e-9) : Math.ceil(drag.acc / STEP - 1e-9);
    if (steps !== 0) {
      drag.acc -= steps * STEP;
      var want = before + steps * STEP;
      var after = setRemaining(t, want, true);
      if (after !== want) { drag.acc = 0; d = 0; }   // clamped: the ring stops here
    }

    setRot();
  });
  function endDrag(e) {
    if (!drag || e.pointerId !== drag.id) return;
    drag = null; dial.classList.remove("scrubbing");
    render(); save();   // one full refresh and one disk write per gesture
  }
  dial.addEventListener("pointerup", endDrag);
  dial.addEventListener("pointercancel", endDrag);
  dial.addEventListener("wheel", function (e) {
    e.preventDefault();
    var t = cur();
    if (t.running) pause(t);
    var dir = e.deltaY > 0 ? -1 : 1, before = Math.round(t.remaining);
    if (setRemaining(t, before + dir * STEP) !== before) { G.rot += dir * 6; setRot(); }
  }, { passive: false });
  dial.addEventListener("keydown", function (e) {
    var t = cur(), dir = 0;
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") dir = -1;
    if (e.key === "ArrowRight" || e.key === "ArrowUp") dir = 1;
    if (!dir) return;
    e.preventDefault();
    if (t.running) pause(t);
    var before = Math.round(t.remaining);
    if (setRemaining(t, before + dir * STEP) !== before) { G.rot += dir * 6; setRot(); }
  });

  /* ---------- Buttons ---------- */
  goBtn.addEventListener("click", function () {
    audio();
    var t = cur();
    if (t.done) { var n = nextUp(t); loadPreset(t, n.min, n.mode); start(t); return; }
    if (t.running) pause(t); else start(t);
  });
  $("resetBtn").addEventListener("click", function () { var t = cur(); loadPreset(t, t.presetMin, t.mode); });
  $("presets").addEventListener("click", function (e) {
    var b = e.target.closest(".preset"); if (!b) return;
    loadPreset(cur(), +b.dataset.min, b.dataset.mode);
  });
  var nudges = document.querySelectorAll(".nudge");
  for (var i = 0; i < nudges.length; i++) {
    nudges[i].addEventListener("click", function () {
      audio();
      var t = cur();
      setRemaining(t, Math.round(rem(t)) + (+this.dataset.d));
    });
  }
  tabsEl.addEventListener("click", function (e) {
    var tab = e.target.closest(".tab");
    if (tab) { G.sel = +tab.dataset.i; render(); save(); }
  });
  $("soundBtn").addEventListener("click", function () {
    G.sound = !G.sound; store("sound", G.sound);
    renderSound();
  });
  var fsBtn = $("fsBtn"), docEl = document.documentElement;
  var fsOn = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
  var fsOff = document.exitFullscreen || document.webkitExitFullscreen;
  function inFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function goFs() { try { var p = fsOn.call(docEl); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
  if ((document.fullscreenEnabled || document.webkitFullscreenEnabled) && fsOn) {
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", function () {
      if (inFs()) { try { var p = fsOff.call(document); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
      else goFs();
    });
    // Browsers without PWA install (Jelly, plain WebViews) open a home-screen shortcut
    // as an ordinary tab. On a touch device that isn't already standalone, the first
    // tap asks for full screen so the browser chrome goes away.
    var standalone = navigator.standalone ||
      (window.matchMedia && (matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches));
    var coarse = window.matchMedia && matchMedia("(pointer: coarse)").matches;
    if (!standalone && coarse) {
      document.addEventListener("pointerup", function (e) {
        if (!inFs() && e.target !== fsBtn && !fsBtn.contains(e.target)) goFs();
      }, true);
    }
  }
  document.addEventListener("keydown", function (e) {
    if (e.target === dial) return;
    if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); goBtn.click(); }
  });

  /* ---------- Portrait sizing ---------- */
  // In portrait the controls keep their natural height and the dial gets the rest,
  // so the page fits one screen instead of pushing the dial off the top.
  var appEl = document.querySelector(".app"), ctlEl = document.querySelector(".controls");
  var portraitMQ = window.matchMedia ? matchMedia("(max-aspect-ratio: 1/1)") : null;
  function fitDial() {
    if (!portraitMQ || !portraitMQ.matches) { dial.style.removeProperty("--dial"); return; }
    var cs = getComputedStyle(appEl);
    var pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.rowGap || cs.gap || 10);
    var avail = document.documentElement.clientHeight - ctlEl.offsetHeight - pad;
    var d = Math.max(200, Math.min(window.innerWidth * 0.86, avail));
    dial.style.setProperty("--dial", Math.floor(d) + "px");
  }
  window.addEventListener("resize", fitDial);
  if (portraitMQ && portraitMQ.addEventListener) portraitMQ.addEventListener("change", fitDial);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitDial);

  /* ---------- Boot ---------- */
  function boot(saved) {
    G.sound = load("sound", true);
    var st = (saved && saved.G) ? saved.G : load("timers", null);
    if (st && st.timers && st.timers.length) {
      G.timers = st.timers.slice(0, TIMERS);
      G.sel = Math.min(st.sel || 0, TIMERS - 1);
      G.focusDone = st.focusDone || 0;
      if (typeof st.rot === "number") G.rot = st.rot;
    } else {
      G.timers = []; G.sel = 0;
    }
    while (G.timers.length < TIMERS) G.timers.push(newTimer(COLORS[G.timers.length], 25, "focus"));
    recolor();
    // Timers that ran out while the page was closed finish quietly.
    G.timers.forEach(function (t) {
      if (t.running && t.endAt <= Date.now()) { t.endedAt = t.endAt; t.running = false; t.remaining = 0; t.done = true; }
    });
    if (anyRunning()) wake();
    buildStars(); renderSound(); renderNow(); render(); save(); fitDial();
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () { return { G: G }; });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot(window.claude && window.claude.hot ? window.claude.hot.data : null);
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
